# Ethereum: run with `target/release/indexer indexer.ethereum.toml`, one process per chain.
#
# Every key is documented in `src/config.rs`. The endpoints are secrets, read from the
# environment (Infisical, see the README's Secrets), and every one must be set at startup. Without
# `stop_block` the run follows live heads once it has caught up, over the WebSocket
# endpoint; with one it exits there and never opens it, so a placeholder will do.

[ingest]
chain = "ethereum"
http_url = { env = "INDEXER_ETHEREUM_HTTP_URL" }
ws_url = { env = "INDEXER_ETHEREUM_WS_URL" }
# The Metric factory's first event, the earliest log of any Metric contract on this
# chain. Stores already past it resume from their ledger and ignore it.
start_block = 25984373
backfill_concurrency = 16
# How many blocks under the head a fork may still reach. Ethereum finalizes every two
# epochs, so its finalized block is normally 64 to 95 blocks behind the head; 128 leaves
# a margin. Only the blocks above it go one at a time through the reorg-aware path.
finality_depth = 128
# How deep a fork a run can retract; a deeper one stops it. Each store's ledger keeps this
# many blocks and a restart reads them back, one lake file a commit: 4,096 blocks of
# Ethereum is 13.6 hours of files. 512 is about 1.7 hours, four times `finality_depth`,
# and every reorg seen here was one block. Narrowing is safe; see `src/window.rs` before
# widening.
undo_window = 512
# stop_block = <height>    # index through this height and exit instead

# Instead of http_url and ws_url, a HyperSync backfill that exits `finality_depth` blocks
# under the head (README: Backfilling from HyperSync). Ranges of `span` heights, `concurrency` in
# flight, each held whole until accepted, so memory is about span × concurrency blocks.
# [ingest.hypersync]
# url = "https://1.hypersync.xyz"
# token = { env = "INDEXER_ENVIO_HYPERSYNC_TOKEN" }
# span = 500
# concurrency = 3

# The app's PostgreSQL (PlanetScale): only what the app serves, a subset of the lake below,
# in the database schema named for the chain. Requires the `postgres` feature. The connection
# string is a secret, since it carries the password.
[sink.postgres]
tables = [
    "metric_v1_*",
    # Each oracle update's raw record, about 1.2M a day on Robinhood Chain; the prices it
    # carries are in `metric_v1_oracle_prices`, which `metric_v1_*` keeps.
    "!metric_v1_oracle_provider_feed_updated",
    # The compressed oracle's, likewise: millions a day on BNB Smart Chain, its prices in
    # `metric_v1_compressed_oracle_prices`.
    "!metric_v1_compressed_oracle_feed_updated",
    # Each swap's and bin fill's raw record, their words still packed; nothing reads them, and
    # `metric_v1_swaps` and `metric_v1_bin_fills` hold the same events unpacked.
    "!metric_v1_metric_omm_pool_swap",
    "!metric_v1_metric_omm_pool_bin_swapped",
    # Who read which feed, with no price.
    "!metric_v1_*_price_read",
    # Each Uniswap pool's tokens and fee, for all time: a backfill fills these from the lake.
    "uniswap_v3_uniswap_v3_factory_pool_created",
    "uniswap_v4_pool_manager_initialize",
    # Each swap's raw amounts and price, from the deploy that routed them on, with no history:
    # a backfill must never list these. metric-tools keeps the pools it wants and deletes the rest.
    "uniswap_v3_pool_swap",
    "uniswap_v4_pool_manager_swap",
]
connection_string = { env = "INDEXER_POSTGRES_URL" }
batch_records = 10000

# Everything, as Delta tables on Cloudflare R2 under s3://blockchain-data/<chain>/: `*`
# matches every dataset, decoded event table, and derived table, including ones added
# later, so the lake is the complete record and PostgreSQL the subset the app serves.
# Requires the `delta` feature. R2 takes region "auto"; the keys are an R2 API token's.
[sink.delta]
tables = ["*"]
uri = "s3://blockchain-data"
# While catching up, a commit is made each time this many bytes of rows are buffered,
# and each commit costs a round trip per table it touches, so a larger buffer means
# fewer, larger commits. At the tip the commit interval below comes first. A commit
# briefly holds twice this in memory, so 256 MiB keeps a chain catching up after an
# outage inside its 2.5 GB container. A HyperSync backfill wants 1 GiB (1073741824)
# and a larger box.
max_buffer_bytes = 268435456
# At the tip a commit is made once the oldest buffered block has waited this long. Each
# commit writes a file and a log entry per table it touches, so a longer wait means
# fewer requests and larger files, at the cost of the lake trailing the chain by up to
# this much (PostgreSQL commits every block regardless), and of a restart refetching
# up to this much of the chain into every store.
commit_interval_secs = 150
# How many heights one partition covers: about a day of Ethereum. A restart reads the
# newest one or two partitions, and the tip's small files pile up in the newest until
# compaction closes it, so the default 100,000 (two weeks) made opening take most of an
# hour. The lake's tables record their width and refuse another, so changing this means
# rewriting them.
partition_blocks = 7200

[sink.delta.storage]
endpoint = { env = "S3_ENDPOINT" }
region = "auto"
access_key_id = { env = "S3_ACCESS_KEY_ID" }
secret_access_key = { env = "S3_SECRET_ACCESS_KEY" }
# How long an idle connection to R2 is kept for reuse. The client's default, 90 s, is
# shorter than a commit interval, so every commit at the tip opened new connections.
pool_idle_timeout = "5m"

# Every protocol manifest under `protocols/`; each lists its addresses per chain.
[decode]
protocols = "protocols"

# `indexer backfill indexer.ethereum.toml` decodes manifests added after their blocks were
# indexed, from the logs `[sink.delta]` holds, into that lake and the `[sink.postgres]`
# tables. The running indexer ignores this section. Before running, deploy the manifests
# to the running indexer. Run right after the deploy: discovered contracts are handed over
# at once, then the backfill waits until the lake's tip is four ledger windows (2,052
# blocks) past the restart and the handed-over contracts' records, and fills. See
# `src/backfill/mod.rs` and the README's "Backfilling new protocols from the lake".
# [backfill]
# protocols = "protocols/<protocol>"   # the manifests to backfill; required
# from = <height>                      # the lake's first when absent; a stopped run's `resume_from`
# to = <height>                        # the bound once it passes the restart when absent; given, no waiting
# streams = 2                          # Parquet streams per read; half the cores when absent
# only = ["0x…"]                       # discovered contracts to hand over; every one when absent
# out = "/tmp/indexer-backfill"        # a trial: writes here instead, reads the chain's lake, fills no database
# [backfill.hypersync]                 # finds what factories created before the lake's first block
# url = "https://1.hypersync.xyz"
# token = { env = "INDEXER_ENVIO_HYPERSYNC_TOKEN" }

# The Prometheus endpoint (`src/metrics.rs`). Each chain's container has its own address,
# so every chain listens on the same port; the host's collector scrapes each container.
[metrics]
listen = "0.0.0.0:9100"
