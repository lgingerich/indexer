[package]
name = "decode"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Decodes raw indexer events with a contract ABI, as a stateless transform."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "decode"
path = "src/main.rs"
required-features = ["kafka"]

[features]
default = []
# The broker source and sink the `decode` binary drives. Off by default so a plain
# `cargo build` does not compile C `librdkafka`; the library and its tests need no
# broker at all.
kafka = ["dep:rdkafka", "sink/kafka"]

[lints]
workspace = true

[dependencies]
# The dynamic decoder. Static `sol!` decoding cannot cover an open-ended set of
# contracts, so the registry path is runtime-typed; see `registry`.
alloy-dyn-abi = { version = "1.7.3", default-features = false }
# `JsonAbi` and its `Event`, the registry's unit of lookup.
alloy-json-abi = { version = "1.7.3", default-features = false }
alloy-primitives = { workspace = true }
anyhow = { workspace = true }
rdkafka = { workspace = true, optional = true }
serde_json = { workspace = true }
sink = { path = "../sink" }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wire = { path = "../wire" }

[dev-dependencies]
alloy-primitives = { workspace = true }