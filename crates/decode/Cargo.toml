[package]
name = "decode"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Decodes raw indexer events with a contract ABI, as a stateless transform."
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

# No `[[bin]]` yet: the transform is built and tested, but the broker source and
# sink that would drive it are not, so a binary here would have nothing to do. It
# lands with that stage.

[dependencies]
# The dynamic decoder. Static `sol!` decoding cannot cover an open-ended set of
# contracts, so the registry path is runtime-typed; see `registry`.
alloy-dyn-abi = { version = "1.7.3", default-features = false }
# `JsonAbi` and its `Event`, the registry's unit of lookup.
alloy-json-abi = { version = "1.7.3", default-features = false }
alloy-primitives = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
wire = { path = "../wire" }

[dev-dependencies]
alloy-primitives = { workspace = true }