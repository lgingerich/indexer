# Uniswap V4. See `src/decode/catalog.rs` for the manifest format.
#
# V4 has no per-pool contract: one PoolManager holds every pool, and a pool is a bytes32
# id rather than an address, so there is nothing to discover. Its `Initialize` records
# carry each pool's metadata.
protocol = "uniswap_v4"

[[contract]]
abi = ["PoolManager.json"]
# A pool's tokens, fee, tick spacing and hooks are only in its `Initialize`, which for a pool
# older than the lake a backfill fetches from before it.
before_lake = ["Initialize"]
# One pool's history, in order, by its id: every pool has the manager's address. And a
# pool's tokens, which only its `Initialize` says. Not unique: a reorg's replacement of an
# `Initialize` has another key, and a unique index would fail that commit.
indexes = { Initialize = [["chain", "id"]], ModifyLiquidity = [["chain", "id", "block_number", "log_index"]], Swap = [["chain", "id", "block_number", "log_index"]] }
# From Uniswap's deployments page, each verified on Sourcify against this ABI.
addresses = { base = ["0x498581fF718922c3f8e6A244956aF099B2652b2b"], bsc = ["0x28e2ea090877bf75740558f6bfb36a5ffee9e9df"], ethereum = ["0x000000000004444c5dc75cB358380D2e3dE08A90"], robinhood = ["0x8366a39cc670b4001a1121b8f6a443a643e40951"] }
