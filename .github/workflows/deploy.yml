name: Deploy

# Deploys or stops production chains. The Hetzner host (see the infra repo) runs one
# container for every `prod-<chain>` tag of this image and restarts a chain within a
# minute of its tag moving; this workflow is what moves the tags.
#
# - deploy: builds the image from the chosen ref, tags it `sha-<commit>`, and points
#   `prod-<chain>` at it for each chain given; a commit already built is re-tagged, not
#   rebuilt. A chain the host has never run starts.
#   `start_block` and `stop_block` override that chain's settings file for this deploy:
#   the image is the commit's build with one rewritten file on top.
# - stop: points `prod-<chain>` at a no-op image that exits at once, so the chain stays
#   down until its next deploy. A chain whose settings set `stop_block` stops by itself
#   once it gets there; this is for stopping one that would not.
#
# Rolling a chain back is re-pointing its tag at an older commit's build:
#
#   docker buildx imagetools create -t ghcr.io/lgingerich/indexer:prod-bsc \
#     ghcr.io/lgingerich/indexer:sha-<commit>
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [deploy, stop]
        default: deploy
      chains:
        description: "Chains, comma-separated (e.g. bsc,robinhood). Empty with deploy builds without deploying."
        type: string
        required: false
      start_block:
        description: "Deploy, one chain only. A height sets ingest.start_block (refused once the chain has data), none removes it, empty keeps the file's."
        type: string
        required: false
      stop_block:
        description: "Deploy, one chain only. A height sets ingest.stop_block, none removes it (follow live heads), empty keeps the file's."
        type: string
        required: false

permissions:
  contents: read
  packages: write
  # To read CI's runs for the commit.
  actions: read

# One deploy or stop at a time, queued rather than cancelled: two at once could leave a
# `prod-<chain>` tag on either one's commit, and a cancelled one could leave it half moved.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Only a commit CI passed on is deployed: the image builds whatever ref it is
      # given, and a commit that fails to parse a chain's settings or its tests would
      # otherwise reach the host. CI must have finished, so a commit pushed a minute ago
      # waits for it. A stop deploys no code and is never held back.
      - name: Require CI to have passed
        if: inputs.action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')
          if [ "$passed" -eq 0 ]; then
            echo "::error::CI has not passed on $GITHUB_SHA; wait for it, or deploy a commit it passed on"
            exit 1
          fi
      # Every chain named must have a settings file in the image, so a typo fails here
      # instead of pushing a tag the host would run. Block overrides are heights of one
      # chain, so they take exactly one.
      - name: Resolve tags
        id: tags
        env:
          ACTION: ${{ inputs.action }}
          CHAINS: ${{ inputs.chains }}
          START: ${{ inputs.start_block }}
          STOP: ${{ inputs.stop_block }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          chains=$(echo "$CHAINS" | tr ',' ' ')
          for chain in $chains; do
            if [ ! -f "indexer.$chain.toml" ]; then
              echo "::error::no indexer.$chain.toml for chain '$chain'"
              exit 1
            fi
          done
          override=""
          if [ -n "$START$STOP" ]; then
            if [ "$ACTION" != deploy ] || [ "$(echo "$chains" | wc -w)" -ne 1 ]; then
              echo "::error::start_block and stop_block need action deploy and exactly one chain"
              exit 1
            fi
            for value in "$START" "$STOP"; do
              case "$value" in "" | none) ;; *[!0-9]*) echo "::error::'$value' is not a height or none"; exit 1 ;; esac
            done
            override=$(echo "$chains" | tr -d ' ')
          fi
          if [ "$ACTION" = stop ] && [ -z "$chains" ]; then
            echo "::error::stop needs at least one chain"
            exit 1
          fi
          # An overridden chain's tag is pushed by the override step, not the build.
          tags=""
          for chain in $chains; do
            [ "$chain" = "$override" ] || tags="$tags,$IMAGE:prod-$chain"
          done
          if [ "$ACTION" = deploy ]; then
            tags="$IMAGE:sha-$GITHUB_SHA$tags"
          else
            tags="${tags#,}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "override=$override" >> "$GITHUB_OUTPUT"
          echo "$ACTION: $tags${override:+,$IMAGE:prod-$override (start_block=${START:-unchanged}, stop_block=${STOP:-unchanged})}" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image is a function of the commit, so a commit already built is never built
      # again: its chains are pointed at the same `sha-<commit>` image, which also keeps
      # every chain deployed from one commit on identical bytes.
      - if: inputs.action == 'deploy'
        id: built
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "reused the existing build of $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: inputs.action == 'deploy' && steps.built.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # In the registry rather than the Actions cache: the dependency layer is
          # gigabytes, and the Actions cache's 10 GB is CI's.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
      - if: steps.built.outputs.exists == 'true'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          for tag in $(echo "$TAGS" | tr ',' ' '); do
            [ "$tag" = "$IMAGE:sha-$GITHUB_SHA" ] && continue
            docker buildx imagetools create -t "$tag" "$IMAGE:sha-$GITHUB_SHA"
          done
      # Rewrites the chain's settings file and layers it over the commit's build, so the
      # override costs seconds, not a second compile. Each key is set right after
      # `chain = `, the one line every settings file has in `[ingest]`.
      - if: steps.tags.outputs.override != ''
        env:
          CHAIN: ${{ steps.tags.outputs.override }}
          START: ${{ inputs.start_block }}
          STOP: ${{ inputs.stop_block }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          mkdir override
          file="override/indexer.$CHAIN.toml"
          cp "indexer.$CHAIN.toml" "$file"
          if [ "$(grep -c '^chain = ' "$file")" -ne 1 ]; then
            echo "::error::indexer.$CHAIN.toml needs exactly one 'chain = ' line"
            exit 1
          fi
          if [ -n "$START" ]; then
            sed -i '/^start_block *=/d' "$file"
            [ "$START" = none ] || sed -i "/^chain = /a start_block = $START" "$file"
          fi
          if [ -n "$STOP" ]; then
            sed -i '/^stop_block *=/d' "$file"
            [ "$STOP" = none ] || sed -i "/^chain = /a stop_block = $STOP" "$file"
          fi
          { echo '```diff'; diff -u "indexer.$CHAIN.toml" "$file" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # CI checked the file as committed, not as rewritten, so the commit's own binary
          # checks the rewrite before the tag moves. The secrets are not here, so every
          # variable the file names gets a stand-in, as CI's settings test does: this
          # catches a broken file or height, not a wrong secret.
          set --
          for name in $(grep -o 'env = "[A-Za-z0-9_]*"' "$file" | cut -d '"' -f 2 | sort -u); do
            set -- "$@" -e "$name=https://stand-in.invalid"
          done
          docker run --rm "$@" -v "$PWD/$file:/app/indexer.$CHAIN.toml:ro" \
            "$IMAGE:sha-$GITHUB_SHA" --check "indexer.$CHAIN.toml"
          printf 'FROM %s\nCOPY indexer.%s.toml /app/\n' "$IMAGE:sha-$GITHUB_SHA" "$CHAIN" > override/Dockerfile
          docker buildx build --push \
            --label "indexer.start_block=${START:-unchanged}" \
            --label "indexer.stop_block=${STOP:-unchanged}" \
            -t "$IMAGE:prod-$CHAIN" override
      # `true` ignores the settings file the host passes and exits 0, which the host's
      # unit treats as a finished run, not a failure to restart.
      - if: inputs.action == 'stop'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          printf 'FROM busybox:stable\nLABEL indexer.stopped=true\nENTRYPOINT ["true"]\n' > Dockerfile.stopped
          set --
          for tag in $(echo "$TAGS" | tr ',' ' '); do set -- "$@" -t "$tag"; done
          docker buildx build --push -f Dockerfile.stopped "$@" .
