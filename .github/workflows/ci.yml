name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
      - run: cargo nextest run --all-targets --all-features
      # The modules were once crates, and the compiler enforced that `decode` could not
      # reach into `ingest`. Now it is a convention; this is what keeps it one. See the
      # dependency-direction note in `src/decode/mod.rs`.
      - name: decode does not depend on ingest
        run: |
          if grep -rEn 'crate::ingest(::|;)' src/decode; then
            echo "::error::decode must not depend on ingest (src/decode/mod.rs)"
            exit 1
          fi
