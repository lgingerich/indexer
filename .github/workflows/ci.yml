name: CI

on:
  pull_request:
  push:
    branches: [main]

# Debug info is most of a dependency's build output, and the cache restores all of it on
# every run, so CI builds without it. A test panic still names its file and line.
env:
  CARGO_PROFILE_DEV_DEBUG: 0

# Each feature set resolves the dependencies differently and so compiles its own copy of
# them, so each runs as its own job with its own cache rather than one job carrying all
# three. Caches are saved from `main` only: a pull request restores `main`'s and does not
# push it out of the repository's cache space with its own.
#
# Every action is pinned to a commit, since its tags and branches move; the comment names
# the ref it was resolved from. `dtolnay/rust-toolchain`'s toolchain is the `toolchain`
# input, matching `rust-toolchain.toml`.
jobs:
  all-features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      # The `delta` feature brings DataFusion and the AWS SDK, so a cold build is most of
      # the job's time. Cached per lockfile and toolchain.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@19c7190d8e0bc0aa6ec705040b2021eaf1c28bbd # nextest
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo nextest run --all-targets --all-features

  # `--all-features` alone only ever exercises the engines' presence. The no-engine build
  # is the one that can rot: a `duckdb`-only symbol reaching an ungated test fails to
  # compile, and a fixture naming `[sink.duckdb]` fails to parse, so both hide until
  # someone runs this.
  no-default-features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@19c7190d8e0bc0aa6ec705040b2021eaf1c28bbd # nextest
      - run: cargo clippy --no-default-features --all-targets -- -D warnings
      - run: cargo nextest run --no-default-features --all-targets

  # The lake alone is the one store build that shares nothing SQL with the others, so a
  # SQL-only item it reaches through the shared store code shows up only here. The
  # production image's pair, `postgres,delta`, runs here too rather than in a job of its
  # own: adding `postgres` changes no feature of a dependency the lake build already
  # compiled, so it costs only the PostgreSQL client's few crates and this one.
  delta:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --no-default-features --features delta --all-targets -- -D warnings
      - run: cargo clippy --no-default-features --features postgres,delta --all-targets -- -D warnings
