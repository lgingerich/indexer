name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Debug info is most of a dependency's build output, and the cache restores all of it on
# every run, so CI builds without it. A test panic still names its file and line.
env:
  CARGO_PROFILE_DEV_DEBUG: 0

# Each feature set resolves the dependencies differently and so compiles its own copy of
# them, so each runs as its own job with its own cache rather than one job carrying all
# three. Caches are saved from `main` only: a pull request restores `main`'s and does not
# push it out of the repository's cache space with its own.
jobs:
  all-features:
    # Pinned so a runner image change is a deliberate bump, not a surprise.
    runs-on: ubuntu-24.04
    env:
      # Lints are mostly `warn` so local builds keep going; CI fails on any warning,
      # including Cargo's own lints, which `-D warnings` does not reach.
      CARGO_BUILD_WARNINGS: deny
      RUSTDOCFLAGS: -D warnings
      # kache is a local-only build cache; CI uses rust-cache instead.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # The `delta` feature brings DataFusion and the AWS SDK, so a cold build is most of
      # the job's time. Cached per lockfile and toolchain.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --check
      # The layers are modules, so the compiler allows any path between them. Fail if
      # code (not a comment) in `decode` or `ingest` names the other; see `src/lib.rs`.
      - name: decode and ingest do not depend on each other
        run: |
          if grep -rnE 'crate::ingest\b' src/decode --include='*.rs' | grep -vE '^[^:]+:[0-9]+:\s*//' \
            || grep -rnE 'crate::decode\b' src/ingest --include='*.rs' | grep -vE '^[^:]+:[0-9]+:\s*//'; then
            echo "decode and ingest must not depend on each other" >&2
            exit 1
          fi
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
      - run: cargo test --locked --doc
      - run: cargo nextest run --locked --all-targets --all-features --no-tests pass

  # `--all-features` alone only ever exercises the engines' presence. The no-engine build
  # is the one that can rot: a `duckdb`-only symbol reaching an ungated test fails to
  # compile, and a fixture naming `[sink.duckdb]` fails to parse, so both hide until
  # someone runs this.
  no-default-features:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_WARNINGS: deny
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo nextest run --locked --no-default-features --all-targets --no-tests pass

  # The lake alone is the one store build that shares nothing SQL with the others, so a
  # SQL-only item it reaches through the shared store code shows up only here. The
  # production image's pair, `postgres,delta`, runs here too rather than in a job of its
  # own: adding `postgres` changes no feature of a dependency the lake build already
  # compiled, so it costs only the PostgreSQL client's few crates and this one.
  delta:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_WARNINGS: deny
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --no-default-features --features delta --all-targets -- -D warnings
      - run: cargo clippy --locked --no-default-features --features postgres,delta --all-targets -- -D warnings
