# Every setting the indexer accepts, in one file. The uncommented minimum is a
# runnable deployment; each commented block is an optional feature to switch on.
# Every key is documented in `src/config.rs`.
#
# Secrets — the RPC endpoints and the PostgreSQL connection string — are written either
# as the value or as `{ env = "NAME" }`, naming the environment variable that holds it.
# The variable is read once at startup; an unset one is an error naming it. A deployment
# names variables, so this file stays in git while the platform's secret manager injects
# the values. For local development, either export the variables (see `.env.example`) or
# write the values into a gitignored copy of this file named `*.local.toml`.

[ingest]
# The chain id stamped on every event. Required.
chain = "base"
# JSON-RPC endpoint for blocks, receipts, and logs. Required; a secret. A public endpoint can
# be written as its value; one carrying an API key is named by its variable.
http_url = "https://base-rpc.publicnode.com"
# http_url = { env = "INDEXER_HTTP_URL" }
# WebSocket endpoint for heads. Required; a secret, like http_url.
ws_url = "wss://base-rpc.publicnode.com"
# ws_url = { env = "INDEXER_WS_URL" }

# First height to index on an empty store. Omitted starts at the observed head,
# skipping earlier history; a value indexes that height onward before following live
# heads. A value above the current head is a startup error rather than a silent clamp.
# A store that already holds blocks resumes after them, and setting this alongside one
# is a startup error, so remove it once the first run has committed.
# start_block = 12345678

# Where records go: any combination of the stores below, at most one of each. Every
# sink lists the tables it writes, as exact names, `*` globs over names, or
# `contract_events` for every contract's decoded event table (one per event of every
# protocol manifest, such as `uniswap_v3_pool_swap`, including protocols added later).
# The tables are `blocks`, `transactions`, `logs`, `decoded_logs`, the event tables,
# and the derived tables (`src/decode/derive`, such as `metric_v1_swaps`), which a glob also
# matches but `contract_events` does not. Every store also writes `accepted_blocks`,
# `reorgs`, and `contracts` on its own; they are not listed.
#
# What ingest fetches follows from the tables: blocks and transactions when a sink
# writes them, logs when a sink writes logs or anything decoded or derived from them,
# and transactions too for a derived table, whose rows carry the transaction's sender
# and recipient. Logs without transactions use eth_getLogs, over a range of up to ten
# heights in backfill; transactions read the block body and its receipts, and logs come
# from those.
#
# On a restart every store is brought back to the newest block they all hold, and
# ingest resumes from there. A store added to a running deployment starts where the
# others resume; earlier blocks are not backfilled into it.

# Print the stream as newline-delimited JSON and keep nothing. Available in every
# build. Runs alone: it cannot be named beside a store. The decoded tables exist only
# with `[decode] protocols` set, so they are added here once it is.
[sink.stdout]
tables = ["blocks", "transactions", "logs"]

# An embedded DuckDB database. Requires the `duckdb` feature.
# [sink.duckdb]
# tables = ["blocks", "transactions", "logs", "decoded_logs", "contract_events"]
# path = "indexer.duckdb"
# The most records one commit may cover. Blocks are folded into one commit up to
# this many when storage has fallen behind; a block is never split.
# batch_records = 500

# Any other DuckDB setting, passed straight through and validated by the engine.
# [sink.duckdb.settings]
# threads = "4"
# max_memory = "1GB"

# A remote PostgreSQL 18 database, written with transactional binary COPY and
# upserted on (chain, dedupe_key). Requires the `postgres` feature. The connection
# string is a secret, since it carries the password: URL or keyword syntax, with TLS
# following its sslmode.
# [sink.postgres]
# tables = ["contract_events"]
# connection_string = { env = "INDEXER_POSTGRES_URL" }
# batch_records = 500

# Delta Lake tables on object storage, one per table under `<uri>/<chain>/`: the cheap
# raw-data lake. Requires the `delta` feature. Written at the tip; a reorg deletes the
# orphaned rows. `uri` is an `s3://` URL (any S3-compatible store) or a local directory.
# Run one indexer per chain and `uri`: unlike the databases, nothing locks out a second.
# [sink.delta]
# tables = ["blocks", "transactions", "logs", "decoded_logs"]
# uri = "s3://indexer-lake"
# Rows are committed this often, or sooner once this many bytes are buffered; the two
# set the lake's file size.
# commit_interval_secs = 30
# max_buffer_bytes = 268435456
# The store compacts the partitions the tip has left behind and, once a day, deletes
# files no commit has referenced for this long. Turn it off only if another job does it.
# maintenance = true
# vacuum_retention_hours = 168

# S3 options, passed straight through. Every value may be `{ env = "NAME" }`;
# credentials may also come from the standard `AWS_*` environment variables. Leave
# `endpoint` out for AWS S3; set it for any other S3-compatible store.
# [sink.delta.storage]
# endpoint = "https://s3.example.com"
# region = "us-east-1"
# access_key_id = { env = "S3_ACCESS_KEY_ID" }
# secret_access_key = { env = "S3_SECRET_ACCESS_KEY" }

# What the decode stage decodes: a directory of protocol manifests (see `protocols/`),
# so the catalog grows without churning this file. Absent means nothing is decoded,
# which is a legitimate way to run.
# [decode]
# protocols = "protocols"
