# Every setting the indexer accepts, in one file. The uncommented minimum is a
# runnable deployment; each commented block is an optional feature to switch on.
# Exactly one `[sink.<backend>]` may be present, so enabling a second sink means
# commenting the first back out. Every key is documented in `src/config.rs`.
#
# Secrets — the RPC endpoints and the PostgreSQL connection string — are written either
# as the value or as `{ env = "NAME" }`, naming the environment variable that holds it.
# The variable is read once at startup; an unset one is an error naming it. A deployment
# names variables, so this file stays in git while the platform's secret manager injects
# the values. For local development, either export the variables (see `.env.example`) or
# write the values into a gitignored copy of this file named `*.local.toml`.

[ingest]
# The chain id stamped on every event. Required.
chain = "base"
# JSON-RPC endpoint for blocks and receipts. Required; a secret. A public endpoint can
# be written as its value; one carrying an API key is named by its variable.
http_url = "https://base-rpc.publicnode.com"
# http_url = { env = "INDEXER_HTTP_URL" }
# WebSocket endpoint for heads. Required; a secret, like http_url.
ws_url = "wss://base-rpc.publicnode.com"
# ws_url = { env = "INDEXER_WS_URL" }

# Which datasets to fetch and store: any combination of these four, but not empty.
# Omitted means all four. Logs without receipts use one eth_getLogs per height;
# every other dataset reads the block body.
# datasets = ["block", "transaction", "receipt", "log"]

# Contracts `eth_getLogs` is limited to. Sent only when logs are selected and
# receipts are not (receipts already carry every log, so any other combination is
# rejected). Omitted or empty fetches every log.
# log_addresses = ["0x1111111111111111111111111111111111111111"]

# First height to index on an empty store. Omitted starts at the observed head,
# skipping earlier history; a value indexes that height onward before following live
# heads. A value above the current head is a startup error rather than a silent clamp.
# A store that already holds blocks resumes after them, and setting this alongside one
# is a startup error, so remove it once the first run has committed.
# start_block = 12345678

# Where records go. The backend is the table, so exactly one of these may be named.

# Print the stream as newline-delimited JSON and keep nothing. Available in every
# build; takes no settings.
[sink.stdout]

# An embedded DuckDB database. Requires the `duckdb` feature.
# [sink.duckdb]
# path = "indexer.duckdb"
# The most records one commit may cover. Blocks are folded into one commit up to
# this many when storage has fallen behind; a block is never split.
# batch_records = 500

# Any other DuckDB setting, passed straight through and validated by the engine.
# [sink.duckdb.settings]
# threads = "4"
# max_memory = "1GB"

# A remote PostgreSQL 18 database, written with transactional binary COPY and
# upserted on (chain, dedupe_key). Requires the `postgres` feature. The connection
# string is a secret, since it carries the password: URL or keyword syntax, with TLS
# following its sslmode.
# [sink.postgres]
# connection_string = { env = "INDEXER_POSTGRES_URL" }
# batch_records = 500

# What the decode stage decodes: a directory of protocol manifests (see `protocols/`),
# so the catalog grows without churning this file. Absent means nothing is decoded,
# which is a legitimate way to run.
# [decode]
# protocols = "protocols"
