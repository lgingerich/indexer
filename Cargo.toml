[package]
name = "indexer"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
authors = ["Landon Gingerich"]
description = "A low-latency, chain-agnostic blockchain indexer."
readme = "README.md"
repository = "https://github.com/lgingerich/indexer"
license = "MIT OR Apache-2.0"

[[bin]]
name = "indexer"
path = "src/main.rs"

[features]
default = []
# Local `DuckDB` store (`sink::duckdb`). Off by default: the `stdout` sink needs no
# feature and no engine, so a bare `cargo run` prints and compiles fast. Add `duckdb`
# for the embedded store, which pays for the bundled C++ engine at build time.
duckdb = ["store", "dep:duckdb"]
# Remote PostgreSQL store, using asynchronous COPY and platform TLS.
postgres = ["store", "dep:bytes", "dep:native-tls", "dep:postgres-native-tls", "dep:tokio-postgres"]
# Delta Lake tables on object storage (`sink::delta`): the cheap raw-data lake. Off by
# default because delta-rs brings DataFusion and Arrow, which are heavy to build.
delta = ["store", "dep:chrono", "dep:deltalake"]
# Internal: what every store feature shares (the storage channel, its progress log, the
# store's error). Enabled by each store above, not meant to be named on its own.
store = []

[dependencies]
# The alloy 2.x crates are released together, from one repository, and pass each other's
# types across their APIs, so they are pinned to one release together. With a caret on
# some and `=` on others, a `cargo update` would move only the caret ones to the next
# release and mix two. `alloy-primitives` and the ABI crates are alloy's core, released
# on their own, and stay on caret.
alloy-consensus = "=2.5.0"
# Typed RPC errors preserve the node's error payload and method-not-found code.
alloy-json-rpc = "=2.5.0"
# The subscription connector a source takes, so heads can come from any `PubSubConnect`.
alloy-pubsub = "=2.5.0"
alloy-provider = { version = "=2.5.0", default-features = false, features = ["reqwest", "reqwest-native-tls", "ws"] }
alloy-transport = "=2.5.0"
alloy-rpc-client = { version = "=2.5.0", default-features = false, features = ["reqwest"] }
# `any` types (`AnyRpcBlock`/`AnyRpcTransaction`) are alloy's catch-all for networks
# whose transaction types fall outside Ethereum's 0-4: an OP-stack deposit (`0x7e`)
# or Arbitrum retry (`0x6a`) otherwise fails the whole block. See `ingest::source`.
alloy-network = "=2.5.0"
alloy-primitives = { version = "1.7.3", default-features = false, features = ["serde", "std"] }
alloy-rpc-types-eth = { version = "=2.5.0", default-features = false, features = ["serde", "std"] }
# alloy's own serde helpers. `quantity` renders integers as the Ethereum JSON-RPC
# "quantity" format (`0x` hex), which is the canonical wire form for these fields
# and, unlike serde's native integer encoding, survives `#[serde(flatten)]` for
# `u128` (see `wire::envelope::Envelope`).
alloy-serde = { version = "=2.5.0", default-features = false, features = ["std"] }
# The dynamic decoder. Static `sol!` decoding cannot cover an open-ended set of
# contracts, so the registry path is runtime-typed; see `decode::ContractRegistry`.
alloy-dyn-abi = { version = "1.7.3", default-features = false }
# `JsonAbi` and its `Event`, the registry's unit of lookup.
alloy-json-abi = { version = "1.7.3", default-features = false }
# Bundled DuckDB compiles the C++ engine once via duckdb-sys; it is an embedded,
# single-writer store, used only by the local DuckDB sink (`duckdb` feature).
duckdb = { version = "1.10506.0", default-features = false, features = ["bundled"], optional = true }
bytes = { version = "1.12.1", optional = true }
# The duration delta-rs takes for a vacuum's retention (`delta` feature).
chrono = { version = "0.4.45", default-features = false, optional = true }
# Delta Lake on object storage. `datafusion` is what gives delta-rs its write, delete,
# and optimize operations; `s3-native-tls` asks for platform TLS to S3 and S3-compatible
# stores. Not all of it is: the AWS SDK's credential chain and `object_store`'s client
# still bring rustls.
deltalake = { version = "1.1.1", default-features = false, features = ["datafusion", "s3-native-tls"], optional = true }
futures-util = { version = "0.3.34", features = ["sink"] }
# The process's allocator (`main.rs`). glibc's malloc gives each thread its own arenas
# and keeps what is freed in them, so a run whose large, short-lived buffers (Delta
# writes, compaction, checkpoints) are freed on other threads than allocated them grows
# without bound; mimalloc returns freed pages to the system.
mimalloc = { version = "0.1.52", default-features = false }
# The metrics facade the layers record through (`crate::metrics`): its macros do nothing
# until a recorder is installed, so a test or a run without `[metrics]` pays nothing.
metrics = "0.24.6"
# The Prometheus recorder and the HTTP listener it is scraped from. Only the listener:
# the push gateway would bring rustls and a client the indexer has no use for.
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
native-tls = { version = "0.2.18", optional = true }
postgres-native-tls = { version = "0.5.3", optional = true }
tokio-postgres = { version = "0.7.18", optional = true }
# native-tls keeps TLS on the platform (Security.framework on macOS, OpenSSL on
# Linux) so TLS adds no bundled C toolchain of its own. gzip and zstd ask providers to
# compress responses: an eth_getLogs response shrinks about tenfold. A server that
# speaks both picks one; HyperSync picks zstd, which it compresses and we decompress
# faster than gzip.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "http2", "native-tls", "gzip", "zstd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
thiserror = "2.0.21"
# The settings file. One format, with `serde` doing the parsing so an unknown key is
# an error rather than a silently ignored typo.
toml = { version = "1.1.7", features = ["parse"] }
tokio = { version = "1.53.2", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
# Alloy 2.5.0 uses tungstenite 0.29 and enables rustls. Unifying native-tls
# makes tungstenite prefer platform TLS while retaining Alloy's required features.
# The retry layer around the RPC transport is a tower `Layer`, as alloy's own are.
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "native-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["test-util"] }

[[bench]]
name = "hot_path"
harness = false

[profile.release]
codegen-units = 1
debug = 0
debug-assertions = false
incremental = false
opt-level = 3
lto = true
strip = "debuginfo"

[profile.release-profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[profile.dev]
codegen-units = 256
debug = 2
debug-assertions = true
incremental = true
opt-level = 0
lto = false
panic = "unwind"
strip = false

[lints.rust]
# Levels: `deny` fails every build, for code that is unsound or definitely wrong.
# `warn` lets local builds continue; CI sets CARGO_BUILD_WARNINGS=deny, so every
# warning must be fixed before merge.

# === Deny: unsound or definitely wrong ===
ambiguous_negative_literals     = "deny"
unreachable_patterns            = "deny"
unsafe_code                     = "deny"
unsafe_op_in_unsafe_fn          = "deny"

# === Likely bugs ===
deprecated_in_future            = "warn"
let_underscore_drop             = "warn"
unexpected_cfgs                 = "warn"
unit_bindings                   = "warn"

# === Unused code ===
dead_code                       = "warn"
redundant_imports               = "warn"
redundant_lifetimes             = "warn"
unreachable_code                = "warn"
unused_assignments              = "warn"
unused_import_braces            = "warn"
unused_imports                  = "warn"
unused_lifetimes                = "warn"
unused_macro_rules              = "warn"
unused_macros                   = "warn"
unused_mut                      = "warn"
unused_qualifications           = "warn"
unused_variables                = "warn"

# === Public API and docs ===
missing_debug_implementations   = "warn"
missing_docs                    = "warn"
unnameable_types                = "warn"
unreachable_pub                 = "warn"

# === Clarity ===
elided_lifetimes_in_paths       = "warn"
explicit_outlives_requirements  = "warn"
impl_trait_redundant_captures   = "warn"
trivial_casts                   = "warn"
trivial_numeric_casts           = "warn"

[lints.cargo]
unused_dependencies             = "warn"

[lints.clippy]
pedantic                        = { level = "warn", priority = -2 }
type_complexity                 = "allow"

# === Deny: unsafe code and pointers ===
as_ptr_cast_mut                 = "deny"
borrow_as_ptr                   = "deny"
cast_ptr_alignment              = "deny"
mem_forget                      = "deny"
multiple_unsafe_ops_per_block   = "deny"
non_send_fields_in_send_ty      = "deny"
not_unsafe_ptr_arg_deref        = "deny"
ptr_as_ptr                      = "deny"
ptr_cast_constness              = "deny"
ref_as_ptr                      = "deny"
trailing_empty_array            = "deny"
transmute_ptr_to_ptr            = "deny"
transmute_undefined_repr        = "deny"
undocumented_unsafe_blocks      = "deny"
uninhabited_references          = "deny"
uninit_vec                      = "deny"
unnecessary_safety_comment      = "deny"
unnecessary_safety_doc          = "deny"

# === Deny: definite bugs ===
coerce_container_to_any         = "deny"
debug_assert_with_mut_call      = "deny"
drop_non_drop                   = "deny"
fn_to_numeric_cast_any          = "deny"
lossy_float_literal             = "deny"
mixed_read_write_in_expression  = "deny"
path_buf_push_overwrite         = "deny"
read_zero_byte_vec              = "deny"
suspicious_xor_used_as_pow      = "deny"

# === Likely bugs ===
arc_with_non_send_sync          = "warn"
cfg_not_test                    = "warn"
collection_is_never_read        = "warn"
fallible_impl_from              = "warn"
if_same_then_else               = "warn"
infinite_loop                   = "warn"
map_err_ignore                  = "warn"
redundant_locals                = "warn"
significant_drop_in_scrutinee   = "warn"
unused_peekable                 = "warn"
unused_result_ok                = "warn"
while_float                     = "warn"

# === Panics and leftovers ===
dbg_macro                       = "warn"
exit                            = "warn"
expect_used                     = "warn"
print_stderr                    = "warn"
print_stdout                    = "warn"
todo                            = "warn"
unimplemented                   = "warn"
unwrap_used                     = "warn"

# === Performance ===
assigning_clones                = "warn"
box_collection                  = "warn"
boxed_local                     = "warn"
clear_with_drain                = "warn"
expect_fun_call                 = "warn"
format_collect                  = "warn"
implicit_clone                  = "warn"
inefficient_to_string           = "warn"
iter_overeager_cloned           = "warn"
iter_with_drain                 = "warn"
large_enum_variant              = "warn"
large_futures                   = "warn"
large_include_file              = "warn"
large_stack_frames              = "warn"
large_types_passed_by_value     = "warn"
manual_memcpy                   = "warn"
map_clone                       = "warn"
needless_collect                = "warn"
needless_pass_by_ref_mut        = "warn"
needless_pass_by_value          = "warn"
or_fun_call                     = "warn"
pathbuf_init_then_push          = "warn"
rc_mutex                        = "warn"
redundant_clone                 = "warn"
set_contains_or_insert          = "warn"
single_char_pattern             = "warn"
string_lit_chars_any            = "warn"
trivial_regex                   = "warn"
trivially_copy_pass_by_ref      = "warn"
unnecessary_lazy_evaluations    = "warn"
unnecessary_to_owned            = "warn"
vec_box                         = "warn"
vec_init_then_push              = "warn"
verbose_file_reads              = "warn"

# === Clarity ===
allow_attributes                = "warn"
allow_attributes_without_reason = "warn"
as_underscore                   = "warn"
assertions_on_result_states     = "warn"
clone_on_copy                   = "warn"
clone_on_ref_ptr                = "warn"
derivable_impls                 = "warn"
derive_partial_eq_without_eq    = "warn"
empty_drop                      = "warn"
empty_enum_variants_with_brackets= "warn"
empty_structs_with_brackets     = "warn"
implicit_saturating_sub         = "warn"
manual_c_str_literals           = "warn"
manual_swap                     = "warn"
mem_replace_option_with_none    = "warn"
needless_raw_strings            = "warn"
needless_type_cast              = "warn"
non_zero_suggestions            = "warn"
precedence                      = "warn"
precedence_bits                 = "warn"
ptr_eq                          = "warn"
redundant_type_annotations      = "warn"
renamed_function_params         = "warn"
rest_pat_in_fully_bound_structs = "warn"
shadow_unrelated                = "warn"
string_add_assign               = "warn"
tests_outside_test_module       = "warn"
trait_duplication_in_bounds     = "warn"
try_err                         = "warn"
type_repetition_in_bounds       = "warn"
uninlined_format_args           = "warn"
unnecessary_self_imports        = "warn"
unnecessary_struct_initialization= "warn"
unnecessary_unwrap              = "warn"
unused_rounding                 = "warn"
use_self                        = "warn"
used_underscore_binding         = "warn"
useless_conversion              = "warn"
useless_let_if_seq              = "warn"

# === Cargo.toml manifest ===
negative_feature_names          = "warn"
redundant_feature_names         = "warn"
wildcard_dependencies           = "warn"
