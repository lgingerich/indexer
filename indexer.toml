# Settings for a standard single-chain deployment.
#
# `[ingest]` names the chain to follow, `[decode] protocols` names the contracts to decode,
# and `[sink.<backend>]` says where it all goes. Ingest and decode run together in one
# task; storage runs in another, joined by an in-process channel. Every key is documented
# in `src/config.rs`.

[ingest]
chain = "base"
# Public endpoints, so written as values. An endpoint carrying an API key names the
# environment variable that holds it instead: http_url = { env = "INDEXER_HTTP_URL" }.
http_url = "https://base-rpc.publicnode.com"
ws_url = "wss://base-rpc.publicnode.com"
# Datasets to fetch and store. Omitted means all four. Logs without receipts use
# one eth_getLogs per height, reusing the live notification's metadata so no block
# read is issued; every other dataset still reads the block body. log_addresses limits
# that call to those contracts. Empty fetches every log, and
# a non-empty list requires the log dataset without receipts.
# datasets = ["block", "transaction", "receipt", "log"]
# log_addresses = ["0x1111111111111111111111111111111111111111"]

# Where records go, and by which backend. Required: the table names the backend, so
# exactly one may be present. `[sink.duckdb]` persists; naming `[sink.stdout]` instead
# prints the stream and opens no store. An unknown backend is a startup error.
# [sink.stdout]
[sink.duckdb]
path = "indexer.duckdb"

# The most records one store commit may cover. Storage commits each block as it arrives
# and, when it has fallen behind, folds the waiting blocks into one commit up to this many.
# A block is never split, so a commit can run past this by up to one block.
# batch_records = 500

# Any other DuckDB setting, passed straight through and validated by the engine. It lives
# under this table because it is DuckDB's, and nothing else here would understand it.
[sink.duckdb.settings]
threads = "4"
max_memory = "1GB"

# What the decode stage decodes: a directory of protocol manifests — see `protocols/` —
# so the catalog grows without churning these settings. Absent means nothing is decoded,
# which is a legitimate way to run and is said at startup.
[decode]
protocols = "protocols"
