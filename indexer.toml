# Settings for a standard single-chain deployment.
#
# `[ingest]` names the chain to follow, `[decode] protocols` names the contracts to decode,
# and each `[sink.<backend>]` says which tables go to that store. Ingest and decode run
# together in one task; each store runs in another, joined by an in-process channel.
# Every key is documented in `src/config.rs`.

[ingest]
chain = "robinhood"
# Public endpoints, so written as values. An endpoint carrying an API key names the
# environment variable that holds it instead: http_url = { env = "INDEXER_HTTP_URL" }.
http_url = { env = "INDEXER_HTTP_URL" }
ws_url = { env = "INDEXER_WS_URL" }
stop_block = 65835166
# Index through this height and exit, rather than following live heads.


# A remote PostgreSQL 18 database, written with transactional binary COPY and
# upserted on (chain, dedupe_key). Requires the `postgres` feature. The connection
# string is a secret, since it carries the password: URL or keyword syntax, with TLS
# following its sslmode. Writing logs and what is decoded from them, and no blocks or
# transactions, means ingest fetches logs alone: eth_getLogs, live for one height and
# reusing the notification's metadata, and in backfill over up to ten heights.
[sink.postgres]
tables = ["contract_events"]
connection_string = { env = "INDEXER_POSTGRES_URL" }
batch_records = 500

# Delta tables on Cloudflare R2, under s3://blockchain-data/<chain>/<table>. Requires
# the `delta` feature. R2 takes region "auto"; the keys are an R2 API token's.
[sink.delta]
tables = ["logs", "decoded_logs"]
uri = "s3://blockchain-data"

[sink.delta.storage]
endpoint = "https://360e3675b09bddacc6d0d09a78e3fc31.r2.cloudflarestorage.com"
region = "auto"
access_key_id = { env = "S3_ACCESS_KEY_ID" }
secret_access_key = { env = "S3_SECRET_ACCESS_KEY" }

# What the decode stage decodes: a directory of protocol manifests — see `protocols/` —
# so the catalog grows without churning these settings. Absent means nothing is decoded,
# which is a legitimate way to run and is said at startup.
[decode]
protocols = "protocols"
