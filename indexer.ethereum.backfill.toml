# Ethereum backfill: run with `target/release/indexer backfill indexer.ethereum.backfill.toml`.
#
# Decodes protocols added to the manifests after their blocks were indexed, from the logs
# the lake already holds, and appends what the running indexer has not decoded to its own
# tables, beside it; nothing is fetched from a node. Every key is documented in
# `src/backfill/mod.rs`. Before running, deploy the manifests to the running indexer and
# wait until the lake's tip is four ledger windows (16,388 blocks) past its restart; the
# backfill checks this and says what is missing. One backfill runs at a time. See the
# README's "Backfilling new protocols from the lake".

chain = "ethereum"

# The manifests to backfill, a subtree of `protocols/` the running indexer already
# decodes. Required. The whole tree: Uniswap V3 and V4 and Metric's oracle prices are new
# on Ethereum with this deploy, and a protocol the lake holds every row of already, such
# as Metric's own events, gets nothing written twice. Uniswap V3 pools created since the
# lake's first block are discovered from its logs and handed to the running indexer.
protocols = "protocols"

# The first block to backfill; the lake's first when absent. To continue a stopped run,
# the `resume_from` of its last "range backfilled" log line.
# from = <height>

# The last block to backfill; when absent, the lake's tip less four ledger windows, the
# highest block no delete of the running indexer reaches, and never above it.
# to = <height>

# Write to this lake instead, such as a local directory, and only read the chain's: to
# try a backfill out without touching what the running indexer serves.
# out = "/tmp/indexer-backfill"

# The running indexer's database, as `[sink.postgres]` in `indexer.ethereum.toml`, to fill
# too: the decoded tables `tables` routes there get the same rows, upserted, such as
# `metric_v1_oracle_prices`' history. The `{ matched = … }` tables are left out: the
# running indexer fills the matched pools' history itself, knowing which they are.
[postgres]
tables = [
    "metric_v1_*",
    "!metric_v1_oracle_provider_feed_updated",
    "!metric_v1_compressed_oracle_feed_updated",
    "chainlink_data_streams_*",
    "pyth_lazer_*",
    { matched = "uniswap_v3_*" },
    { matched = "uniswap_v4_*" },
]
connection_string = { env = "INDEXER_POSTGRES_URL" }

# The lake the running indexer writes, as `[sink.delta]` in `indexer.ethereum.toml`.
[lake]
uri = "s3://blockchain-data"

[lake.storage]
endpoint = { env = "S3_ENDPOINT" }
region = "auto"
access_key_id = { env = "S3_ACCESS_KEY_ID" }
secret_access_key = { env = "S3_SECRET_ACCESS_KEY" }
pool_idle_timeout = "5m"
